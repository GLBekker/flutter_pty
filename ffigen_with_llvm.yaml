# Run with `dart run ffigen --config ffigen_with_llvm.yaml`.
name: FlutterPtyBindings

description: |
  Bindings for `src/flutter_pty.h`.

  Regenerate bindings with `dart run ffigen --config ffigen_with_llvm.yaml`.

output: "lib/src/flutter_pty_bindings_generated.dart"

llvm-path:
  - "C:/Program Files/LLVM/bin"

headers:
  entry-points:
    - "src/include/dart_api_dl.h"
    - "src/flutter_pty.h"
  include-directives:
    - "src/flutter_pty.h"
    - "src/include/dart_api_dl.h"

functions:
  include:
    - Dart_InitializeApiDL

preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: constant_identifier_names
  // ignore_for_file: non_constant_identifier_names

comments:
  style: any
  length: full